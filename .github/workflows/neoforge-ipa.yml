name: NeoForge patch IPA

on:
  push:
    branches: [feature/neoforge-lwjgl-5.1.0, feature/controlify-1.21.1-passthrough, diagnostics/iris-zink-vertex-input, fix/zink-packed-vertex-input]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'
      - name: Test bounded shader diagnostics
        run: tests/shaders/run.sh
      - name: Test analog controller bridge
        run: tests/controller/run.sh
      - name: Install build tools
        run: brew install make ldid
      - name: Build pinned MoltenVK packed-input backport
        if: github.ref_name == 'fix/zink-packed-vertex-input'
        run: |
          set -o pipefail
          mkdir -p artifacts
          scripts/build-moltenvk-packed-inputs.sh 2>&1 | tee artifacts/moltenvk-packed-input-build.log
      - name: Build iOS packages
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '14.0'
          AMETHYST_SHADER_DIAG_BUILD: ${{ (startsWith(github.ref_name, 'diagnostics/') || github.ref_name == 'fix/zink-packed-vertex-input') && '1' || '0' }}
          CONFIG_CURSEFORGE_API_KEY: ${{ secrets.CONFIG_CURSEFORGE_API_KEY }}
        run: |
          set -o pipefail
          export PATH=/opt/homebrew/bin:$PATH
          export SLIMMED=0
          export BUILD_MOBILEGL=1
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 BOOTJDK="$JAVA_HOME/bin"
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 TROLLSTORE_JIT_ENT=1 BOOTJDK="$JAVA_HOME/bin"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Air-5.1.0-${{ github.ref_name == 'fix/zink-packed-vertex-input' && 'Packed-Input-Fix' || startsWith(github.ref_name, 'diagnostics/') && 'Shader-Diagnostics' || 'NeoForge' }}-IPA
          path: artifacts/com.air-devs.air-*-ios.ipa
          if-no-files-found: error
      - name: Upload TrollStore package
        uses: actions/upload-artifact@v4
        with:
          name: Air-5.1.0-NeoForge-TrollStore
          path: artifacts/com.air-devs.air-*-ios-trollstore.tipa
          if-no-files-found: error
      - name: Upload Java bundles for JPMS verification
        uses: actions/upload-artifact@v4
        with:
          name: Air-Java-bundles
          path: JavaApp/build/*.jar
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Air-build-diagnostics
          path: |
            artifacts/moltenvk-packed-input-*
            mobilegl-build.log
            Natives/build/sfpew_build.log
            artifacts/AngelAuraAmethyst.dSYM
          if-no-files-found: ignore
